name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'         # e.g. v0.2.0
      - 'v[0-9]+.[0-9]+.[0-9]+-*'       # e.g. v0.2.0-preview.1

permissions:
  contents: write   # for creating GitHub releases

jobs:
  publish:
    name: publish to nuget.org
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # GitVersion derives the version from the tag

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          global-json-file: global.json

      - name: Build, test, pack, push
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: ./build.sh --target=NuGetPush

      - name: Upload nupkgs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkg-${{ github.ref_name }}
          path: artifacts/*.*nupkg
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/*.*nupkg
