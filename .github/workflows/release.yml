name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'         # e.g. v0.1.0
      - 'v[0-9]+.[0-9]+.[0-9]+-*'       # e.g. v0.1.0-preview.1

permissions:
  contents: write   # for creating GitHub releases

jobs:
  publish:
    name: publish to nuget.org
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # for SourceLink

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Derive version from tag
        id: ver
        run: |
          ref="${GITHUB_REF#refs/tags/v}"
          echo "version=$ref" >> "$GITHUB_OUTPUT"
          echo "Publishing version $ref"

      - name: Restore
        run: dotnet restore Acp.slnx

      - name: Build (Release)
        run: dotnet build Acp.slnx --no-restore -c Release -p:Version=${{ steps.ver.outputs.version }}

      - name: Test
        run: dotnet test tests/Acp.Tests/Acp.Tests.csproj --no-build -c Release --logger "console;verbosity=normal"

      - name: Pack
        run: dotnet pack src/Acp/Acp.csproj --no-build -c Release -o artifacts -p:Version=${{ steps.ver.outputs.version }}

      - name: Upload nupkgs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkg-${{ steps.ver.outputs.version }}
          path: artifacts/*.*nupkg
          if-no-files-found: error

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "${NUGET_API_KEY}" ]; then
            echo "::error::NUGET_API_KEY secret is not set"
            exit 1
          fi
          dotnet nuget push 'artifacts/*.nupkg' \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*.*nupkg
