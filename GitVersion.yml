mode: ContinuousDelivery
# 0.1.0 shipped from the original repo; this line has breaking wire fixes, so the next release is 0.2.0.
next-version: 0.2.0
tag-prefix: '[vV]?'

branches:
  main:
    regex: '^master$|^main$'
    increment: Patch
    label: 'ci'
    is-main-branch: true

  feature:
    regex: '^(features?|feat|fix|chore)[/-](?<BranchName>.+)'
    increment: Inherit
    label: '{BranchName}'

  release:
    regex: '^releases?[/-](?<BranchName>.+)'
    increment: Minor
    label: rc
    is-release-branch: true

  hotfix:
    regex: '^hotfix(es)?[/-](?<BranchName>.+)'
    increment: Patch
    label: hotfix
